# Free hourly scheduler for the 40-hour supplier clock (use this if your
# Vercel plan only allows daily cron jobs). Needs two repository secrets:
# APP_URL (e.g. https://costsegtrust.com) and CRON_SECRET.
name: Supplier deadlines
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run the deadline check
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/deadlines"
